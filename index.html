<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Olymp OBZR</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="logo">📊 Подготовка к Олимпиаде по ОБЗР 2026</div>
        <div class="nav-tabs">
          <button class="nav-tab active" data-tab="quiz">
            📝 Тестирование
          </button>
          <button class="nav-tab" data-tab="results">📈 Результаты</button>
        </div>
      </div>

      <div class="json-input">
        <label for="jsonFile" class="json-file-label">
          📁 Загрузить файл с вопросами
        </label>
        <input type="file" id="jsonFile" accept=".json, application/json,.zip" />
      </div>
      <div id="quizTab" class="tab-content active">
        <div id="loader" class="loader">
          <div class="spinner"></div>
          Загрузка вопросов...
        </div>

        <div id="content" style="display: none">
          <div class="progress-container">
            <div class="progress-info">
              <span id="counter">Вопрос 0 из 0</span>
              <span id="scoreDisplay">⭐ 0 баллов</span>
            </div>
            <div class="progress-bar">
              <div id="progressFill" class="progress-fill"></div>
            </div>
          </div>

          <div class="quiz-card">
            <div class="question-header">
              <span class="question-tag" id="questionTag"></span>
              <span class="question-points" id="questionPoints"></span>
            </div>

            <div class="question-section">
              <div class="question" id="question"></div>
            </div>

            <div class="answers-area" id="answersArea"></div>

            <div class="button-group">
              <button class="btn btn-check" id="checkBtn">
                📝 Проверить ответ
              </button>
              <button class="btn btn-next" id="nextBtn">
                ➡️ Следующий вопрос
              </button>
            </div>

            <div class="correct-answer" id="correctAnswer"></div>
          </div>
        </div>
      </div>

      <div id="resultsTab" class="tab-content">
        <div class="results-header">
          <h2>📊 Ваши результаты</h2>
          <button id="exportResultsBtn" class="btn btn-export">
            📥 Экспорт результатов
          </button>
        </div>

<div class="stats-grid">
    <div class="stat-card">
        <div class="stat-icon">📋</div>
        <div class="stat-info">
            <span class="stat-label">Всего вопросов</span>
            <span class="stat-value" id="totalQuestions">0</span>
        </div>
    </div>
    <div class="stat-card">
        <div class="stat-icon">✅</div>
        <div class="stat-info">
            <span class="stat-label">Правильных</span>
            <span class="stat-value" id="correctAnswers">0</span>
        </div>
    </div>
    <div class="stat-card">
        <div class="stat-icon">❌</div>
        <div class="stat-info">
            <span class="stat-label">Неправильных</span>
            <span class="stat-value" id="wrongAnswers">0</span>
        </div>
    </div>
    <div class="stat-card">
        <div class="stat-icon">⏭️</div>
        <div class="stat-info">
            <span class="stat-label">Пропущено</span>
            <span class="stat-value" id="noAnswerCount">0</span>
        </div>
    </div>
    <div class="stat-card">
        <div class="stat-icon">❓</div>
        <div class="stat-info">
            <span class="stat-label">Не пройдено</span>
            <span class="stat-value" id="unansweredCount">0</span>
        </div>
    </div>
    <div class="stat-card">
        <div class="stat-icon">⭐</div>
        <div class="stat-info">
            <span class="stat-label">Всего баллов</span>
            <span class="stat-value" id="totalScore">0</span>
        </div>
    </div>
</div>

        <div class="chart-container">
    <canvas id="scoreChart" width="400" height="400"></canvas>
    <div id="chartFallback" style="display: none; text-align: center; padding: 20px;">
        <p style="color: #666;">Диаграмма не загрузилась</p>
    </div>
</div>

        <div class="tags-stats">
          <h3>📌 Статистика по категориям</h3>
          <div id="tagsStatsContainer" class="tags-grid"></div>
        </div>

        <!-- Детальный разбор -->
        <div class="detailed-results">
          <h3>📝 Детальный разбор вопросов</h3>
          <div id="detailedResults" class="questions-list"></div>
        </div>
      </div>

      <div id="error" class="error" style="display: none"></div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        console.log('Chart.js доступен:', typeof Chart !== 'undefined');
        console.log('Canvas элемент:', document.getElementById('scoreChart'));
        
        if (typeof Chart === 'undefined') {
            const script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js';
            document.head.appendChild(script);
            console.log('Chart.js загружен принудительно');
        }
    });
</script>
    <script src="js/quiz.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
